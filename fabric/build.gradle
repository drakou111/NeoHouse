def mcVer = rootProject.ext.active_mc_version
// True when the active Minecraft version is at least {@code min} (compares numerically: 26.1.2 >= 26.1).
def atLeast = { String min ->
    def a = mcVer.tokenize('.').collect { it as int }
    def b = min.tokenize('.').collect { it as int }
    for (int i = 0; i < Math.max(a.size(), b.size()); i++) {
        int x = i < a.size() ? a[i] : 0
        int y = i < b.size() ? b[i] : 0
        if (x != y) return x > y
    }
    return true
}
// Minecraft is unobfuscated from 26.1 on: no mappings and no remapping of the built jar.
def unobfuscated = atLeast('26.1')
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

base {
    archivesName = "${mod_id}-fabric"
}

version = mod_version
group = mod_group_id
java.toolchain.languageVersion = JavaLanguageVersion.of(rootProject.ext.active_java)

loom {
    runs {
        client { client() }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVer}"
    if (unobfuscated) {
        implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.ext.active_fabric_api}"
    } else {
        def parchMc  = rootProject.ext.active_parch_mc
        def parchVer = rootProject.ext.active_parch_ver
        mappings loom.layered() {
            officialMojangMappings()
            if (parchVer && parchMc) parchment("org.parchmentmc.data:parchment-${parchMc}:${parchVer}@zip")
        }
        modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.ext.active_fabric_api}"
    }

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.assertj:assertj-core:3.26.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named("test", Test).configure {
    useJUnitPlatform()
    testLogging { events "failed"; exceptionFormat "full" }
}

// Version-specific compat source dirs: each holds the same classes written against one API range.
sourceSets.main.java.srcDir(atLeast('1.21.6') ? 'src/compat/mc1215plus' : 'src/compat/mc1214')

// In 1.21.5: ClickEvent became a sealed interface with record subtypes (ClickEvent.RunCommand),
// and Inventory.selected went private in favor of the getSelectedSlot() getter.
def oldClickInv = !atLeast('1.21.5')
sourceSets.main.java.srcDir(oldClickInv ? 'src/compat/click_old' : 'src/compat/click_new')
sourceSets.main.java.srcDir(oldClickInv ? 'src/compat/inv_field' : 'src/compat/inv_getter')
// 26.1 renamed inventory clicks (ContainerInput) and the Fabric key, command and HUD APIs.
sourceSets.main.java.srcDir(atLeast('26.1') ? 'src/compat/api26' : 'src/compat/api121')
// 26.2 moved the open screen and the tab list from Minecraft onto Gui.
sourceSets.main.java.srcDir(atLeast('26.2') ? 'src/compat/client_new' : 'src/compat/client_old')
// 26.3 replaced GLFW keyboard input with SDL: different key codes and no org.lwjgl.glfw.
sourceSets.main.java.srcDir(atLeast('26.3') ? 'src/compat/keys_sdl' : 'src/compat/keys_glfw')
sourceSets.main.java.srcDir(
    atLeast('26.1')    ? 'src/compat/mc261plus'   :
    atLeast('1.21.11') ? 'src/compat/mc12111plus' :
    atLeast('1.21.9')  ? 'src/compat/mc1219plus'  :
    atLeast('1.21.6')  ? 'src/compat/mc1216plus'  :
                         'src/compat/mc1218minus'
)

// Generates BuildConstants.java with the current build date baked in.
def generatedBuildSrcDir = layout.buildDirectory.dir("generated/sources/buildinfo")
sourceSets.main.java.srcDir generatedBuildSrcDir

def generateBuildConstants = tasks.register("generateBuildConstants") {
    def buildDate = new Date().format("MMMM d, yyyy")
    inputs.property("buildDate", buildDate)
    outputs.dir(generatedBuildSrcDir)
    doLast {
        def out = generatedBuildSrcDir.get()
                .file("com/drakou111/neohouse/BuildConstants.java").asFile
        out.parentFile.mkdirs()
        out.text = """\
package com.drakou111.neohouse;

public final class BuildConstants {
    public static final String BUILD_DATE = "${buildDate}";
    private BuildConstants() {}
}
"""
    }
}

tasks.named("compileJava").configure { dependsOn(generateBuildConstants) }

// Generates assets/neohouse/library/index.txt listing all .nh files in the library directory,
// which LibraryManager reads at runtime (listing a directory inside a jar is unreliable).
def libResourceDir = file("src/main/resources/assets/neohouse/library")
def generatedLibraryDir = layout.buildDirectory.dir("generated/resources/library")

def generateLibraryIndex = tasks.register("generateLibraryIndex") {
    inputs.files(fileTree(libResourceDir).include("**/*.nh"))
    inputs.file(new File(libResourceDir, "shipped_versions.txt"))
    def indexFile = generatedLibraryDir.get().file("assets/neohouse/library/index.txt").asFile
    outputs.file(indexFile)
    doLast {
        // LibraryManager only upgrades extracted files that match a shipped version, so every
        // current library file must be listed (hash of the text without carriage returns).
        def shipped = new File(libResourceDir, "shipped_versions.txt").readLines()
                .findAll { !it.startsWith("#") && !it.trim().isEmpty() }
                .collect { it.trim() } as Set
        fileTree(libResourceDir).include("**/*.nh").each { file ->
            def path = libResourceDir.toURI().relativize(file.toURI()).toString().replace('\\', '/')
            def text = file.getText("UTF-8").replace("\r", "")
            def hash = java.security.MessageDigest.getInstance("SHA-256").digest(text.getBytes("UTF-8")).encodeHex().toString()
            if (!shipped.contains("${hash} ${path}".toString()))
                throw new GradleException("Library file ${path} changed: add this line to shipped_versions.txt:\n${hash} ${path}")
        }

        indexFile.parentFile.mkdirs()
        indexFile.text = fileTree(libResourceDir).include("**/*.nh")
            .collect { libResourceDir.toURI().relativize(it.toURI()).toString().replace('\\', '/') }
            .sort()
            .join("\n")
    }
}

sourceSets.main.resources.srcDir(generatedLibraryDir)

processResources {
    dependsOn(generateLibraryIndex)
    def replaceProperties = [version: project.version, mod_id: mod_id,
                             minecraft_dependency: rootProject.ext.active_mc_depends,
                             fabric_loader_version: fabric_loader_version]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}
